spring.jpa.hibernate.ddl-auto=update
# SQL por el logger de logback (mismo formato/timestamp que el resto de los
# logs). show-sql imprime por stdout directo y se intercala desordenado.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# Descomentar para ver los valores bindados de cada query en dev:
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── BD local de desarrollo (docker-compose.dev.yml) ────────────────
# Contenedor visco_db_dev en el puerto 5434. Esquema vacio creado por
# Flyway (V1-V21) al arrancar, completado por Hibernate (ddl-auto=update).
# El contenedor crea POSTGRES_DB=visco_db segun docker-compose.dev.yml.
spring.datasource.url=${DB_URL_LOCAL:jdbc:postgresql://localhost:5434/visco_db}
